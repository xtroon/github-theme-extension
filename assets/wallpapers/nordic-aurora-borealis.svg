<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="100%" height="100%">
  <defs>
    <linearGradient id="auroraSky" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#030712"/>
      <stop offset="45%" stop-color="#081426"/>
      <stop offset="80%" stop-color="#0c2338"/>
      <stop offset="100%" stop-color="#050e18"/>
    </linearGradient>

    <!-- Aurora Ribbon 1 -->
    <linearGradient id="auroraGreen1" x1="0%" y1="0%" x2="100%" y2="50%">
      <stop offset="0%" stop-color="#00f5a0" stop-opacity="0"/>
      <stop offset="25%" stop-color="#00f5a0" stop-opacity="0.85"/>
      <stop offset="55%" stop-color="#00d9f5" stop-opacity="0.75"/>
      <stop offset="80%" stop-color="#38ef7d" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#11998e" stop-opacity="0"/>
    </linearGradient>

    <!-- Aurora Ribbon 2 (Higher violet/emerald blend) -->
    <linearGradient id="auroraPurple" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#7f00ff" stop-opacity="0"/>
      <stop offset="35%" stop-color="#00f5a0" stop-opacity="0.7"/>
      <stop offset="65%" stop-color="#e100ff" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#00d9f5" stop-opacity="0"/>
    </linearGradient>

    <filter id="auroraBlur" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="35"/>
    </filter>
    <filter id="auroraSoft" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="18"/>
    </filter>

    <linearGradient id="fjordWater" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#06121f"/>
      <stop offset="50%" stop-color="#092033"/>
      <stop offset="100%" stop-color="#03080e"/>
    </linearGradient>

    <linearGradient id="snowHighlight" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#b8e2f2" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#061424" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <!-- Sky Canvas -->
  <rect width="1920" height="1080" fill="url(#auroraSky)"/>

  <!-- Starry Field -->
  <g fill="#ffffff">
    <circle cx="120" cy="80" r="1.5" opacity="0.8"/>
    <circle cx="280" cy="140" r="1" opacity="0.6"/>
    <circle cx="450" cy="60" r="2" opacity="0.9"/>
    <circle cx="620" cy="110" r="1.2" opacity="0.7"/>
    <circle cx="780" cy="70" r="1.8" opacity="0.85"/>
    <circle cx="940" cy="130" r="1" opacity="0.5"/>
    <circle cx="1100" cy="90" r="2.2" opacity="0.95"/>
    <circle cx="1280" cy="50" r="1.3" opacity="0.75"/>
    <circle cx="1450" cy="120" r="1" opacity="0.6"/>
    <circle cx="1620" cy="75" r="1.7" opacity="0.8"/>
    <circle cx="1780" cy="140" r="1.2" opacity="0.65"/>
    <circle cx="1850" cy="60" r="2" opacity="0.9"/>
    <circle cx="350" cy="220" r="1" opacity="0.5"/>
    <circle cx="520" cy="280" r="1.4" opacity="0.7"/>
    <circle cx="850" cy="240" r="1" opacity="0.6"/>
    <circle cx="1200" cy="210" r="1.6" opacity="0.8"/>
    <circle cx="1550" cy="260" r="1.2" opacity="0.65"/>
    <circle cx="1720" cy="200" r="1.5" opacity="0.75"/>
  </g>

  <!-- Aurora Borealis Curtains -->
  <g filter="url(#auroraBlur)">
    <!-- Deep sweeping wave 1 -->
    <path d="M-100,240 Q300,80 750,220 T1600,140 Q1800,220 2050,160 L2050,560 Q1700,640 1200,480 T300,560 L-100,480 Z" fill="url(#auroraGreen1)" opacity="0.75"/>
    <!-- Deep sweeping wave 2 -->
    <path d="M-50,180 Q450,320 900,160 T1800,280 L1800,600 Q1300,440 850,580 T-50,440 Z" fill="url(#auroraPurple)" opacity="0.6"/>
  </g>

  <!-- Sharper luminous ray layer -->
  <g filter="url(#auroraSoft)" opacity="0.85">
    <path d="M100,190 Q500,90 950,210 Q1400,330 1850,170 L1820,380 Q1350,510 920,390 Q480,270 120,370 Z" fill="url(#auroraGreen1)"/>
    <!-- Vertical curtain rays -->
    <line x1="450" y1="120" x2="480" y2="380" stroke="#00f5a0" stroke-width="25" opacity="0.4" stroke-linecap="round"/>
    <line x1="680" y1="160" x2="710" y2="420" stroke="#00d9f5" stroke-width="35" opacity="0.45" stroke-linecap="round"/>
    <line x1="920" y1="140" x2="950" y2="440" stroke="#38ef7d" stroke-width="30" opacity="0.5" stroke-linecap="round"/>
    <line x1="1150" y1="180" x2="1190" y2="460" stroke="#00f5a0" stroke-width="40" opacity="0.4" stroke-linecap="round"/>
    <line x1="1400" y1="170" x2="1440" y2="430" stroke="#a8ff78" stroke-width="25" opacity="0.35" stroke-linecap="round"/>
  </g>

  <!-- Distant Jagged Mountains -->
  <polygon points="-50,750 150,540 320,660 520,490 680,620 900,460 1120,610 1350,470 1560,630 1780,510 2000,720 2000,1080 -50,1080" fill="#060e1a"/>
  
  <!-- Snow Cap Highlights on Mountains -->
  <polygon points="520,490 470,550 560,550" fill="url(#snowHighlight)"/>
  <polygon points="900,460 840,530 950,530" fill="url(#snowHighlight)"/>
  <polygon points="1350,470 1290,540 1410,540" fill="url(#snowHighlight)"/>
  <polygon points="1780,510 1720,570 1830,570" fill="url(#snowHighlight)"/>

  <!-- Midground Mountains -->
  <polygon points="-50,820 180,670 420,780 700,630 980,770 1260,650 1580,780 1890,660 2050,790 2050,1080 -50,1080" fill="#040912"/>

  <!-- Foreground Arctic Fjord Water -->
  <rect x="0" y="760" width="1920" height="320" fill="url(#fjordWater)"/>

  <!-- Water Aurora Reflection Wave -->
  <ellipse cx="960" cy="880" rx="750" ry="90" fill="#00f5a0" opacity="0.15" filter="url(#auroraBlur)"/>
  <ellipse cx="1100" cy="920" rx="550" ry="70" fill="#00d9f5" opacity="0.12" filter="url(#auroraBlur)"/>

  <!-- Horizontal Fjord Ripple Lines -->
  <g stroke="#00f5a0" stroke-width="1.5" opacity="0.3" fill="none">
    <line x1="400" y1="810" x2="750" y2="810"/>
    <line x1="820" y1="825" x2="1250" y2="825"/>
    <line x1="300" y1="850" x2="880" y2="850"/>
    <line x1="950" y1="865" x2="1550" y2="865"/>
    <line x1="200" y1="890" x2="700" y2="890"/>
    <line x1="800" y1="910" x2="1400" y2="910"/>
    <line x1="500" y1="940" x2="1100" y2="940"/>
    <line x1="150" y1="970" x2="850" y2="970"/>
    <line x1="920" y1="995" x2="1680" y2="995"/>
  </g>

  <!-- Foreground Shoreline Silhouette & Pine Trees -->
  <g fill="#020408">
    <path d="M-20,1080 L-20,930 Q300,920 600,980 Q900,1020 1200,990 Q1500,960 1950,1010 L1950,1080 Z"/>
    <!-- Pine Tree Silhouettes -->
    <polygon points="120,840 95,930 145,930"/>
    <polygon points="120,865 85,950 155,950"/>
    <polygon points="170,820 145,920 195,920"/>
    <polygon points="170,855 135,945 205,945"/>
    <polygon points="230,860 210,935 250,935"/>
    <polygon points="280,830 255,925 305,925"/>
    <polygon points="1680,850 1655,940 1705,940"/>
    <polygon points="1740,820 1715,925 1765,925"/>
    <polygon points="1810,840 1785,935 1835,935"/>
  </g>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="100%" height="100%">
  <defs>
    <linearGradient id="spaceVoid" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#020208"/>
      <stop offset="40%" stop-color="#080718"/>
      <stop offset="75%" stop-color="#0a0515"/>
      <stop offset="100%" stop-color="#030206"/>
    </linearGradient>

    <!-- Nebula Cloud Gradient 1 (Cyan/Teal) -->
    <radialGradient id="nebulaCyan" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#00f2fe" stop-opacity="0.75"/>
      <stop offset="35%" stop-color="#4facfe" stop-opacity="0.45"/>
      <stop offset="70%" stop-color="#000d26" stop-opacity="0.1"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>

    <!-- Nebula Cloud Gradient 2 (Deep Violet / Magenta) -->
    <radialGradient id="nebulaMagenta" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#f72585" stop-opacity="0.7"/>
      <stop offset="35%" stop-color="#7209b7" stop-opacity="0.5"/>
      <stop offset="70%" stop-color="#3a0ca3" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>

    <!-- Nebula Cloud Gradient 3 (Electric Indigo) -->
    <radialGradient id="nebulaIndigo" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#4361ee" stop-opacity="0.65"/>
      <stop offset="50%" stop-color="#3f37c9" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>

    <filter id="cosmicBlur" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="65"/>
    </filter>
    <filter id="dustBlur" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="30"/>
    </filter>
  </defs>

  <!-- Deep Cosmos Base -->
  <rect width="1920" height="1080" fill="url(#spaceVoid)"/>

  <!-- Background Ambient Nebula Glows -->
  <g filter="url(#cosmicBlur)">
    <!-- Main Center Cluster -->
    <ellipse cx="1150" cy="480" rx="650" ry="380" fill="url(#nebulaMagenta)" transform="rotate(-15, 1150, 480)"/>
    <ellipse cx="850" cy="560" rx="550" ry="320" fill="url(#nebulaCyan)" transform="rotate(20, 850, 560)"/>
    <ellipse cx="1400" cy="350" rx="420" ry="260" fill="url(#nebulaIndigo)"/>
    <ellipse cx="480" cy="680" rx="380" ry="220" fill="url(#nebulaMagenta)"/>
  </g>

  <!-- Luminous Swirling Dust Tendrils -->
  <g filter="url(#dustBlur)" opacity="0.8">
    <path d="M400,750 Q750,420 1150,460 T1750,220" stroke="#00f2fe" stroke-width="60" fill="none" opacity="0.45"/>
    <path d="M550,850 Q900,560 1300,520 T1850,380" stroke="#f72585" stroke-width="75" fill="none" opacity="0.35"/>
    <path d="M680,680 Q1050,480 1420,410" stroke="#ffffff" stroke-width="25" fill="none" opacity="0.4"/>
  </g>

  <!-- Distant Planet / Celestial Eclipse Sphere -->
  <g>
    <!-- Dark Planet Silhouette -->
    <circle cx="1380" cy="360" r="140" fill="#05040a"/>
    <!-- Atmosphere Rim Glow (Cyan) -->
    <path d="M1250,310 A140,140 0 0,1 1515,420" stroke="#00f2fe" stroke-width="4" fill="none" opacity="0.85"/>
    <path d="M1250,310 A140,140 0 0,1 1515,420" stroke="#ffffff" stroke-width="1.5" fill="none" opacity="0.95"/>
    <!-- Thin Accretion Ring -->
    <ellipse cx="1380" cy="360" rx="260" ry="42" stroke="#4facfe" stroke-width="3" fill="none" opacity="0.6" transform="rotate(-24, 1380, 360)"/>
    <ellipse cx="1380" cy="360" rx="240" ry="38" stroke="#f72585" stroke-width="1.5" fill="none" opacity="0.45" transform="rotate(-24, 1380, 360)"/>
  </g>

  <!-- Star Field (Over 40 Distinct Stars) -->
  <g fill="#ffffff">
    <!-- Bright Stars with Diffraction Cross Spikes -->
    <g transform="translate(620, 240)">
      <line x1="-20" y1="0" x2="20" y2="0" stroke="#ffffff" stroke-width="1.5"/>
      <line x1="0" y1="-20" x2="0" y2="20" stroke="#ffffff" stroke-width="1.5"/>
      <circle cx="0" cy="0" r="3.5" fill="#ffffff"/>
      <circle cx="0" cy="0" r="10" fill="#00f2fe" opacity="0.5"/>
    </g>

    <g transform="translate(1080, 680)">
      <line x1="-15" y1="0" x2="15" y2="0" stroke="#ffffff" stroke-width="1.2"/>
      <line x1="0" y1="-15" x2="0" y2="15" stroke="#ffffff" stroke-width="1.2"/>
      <circle cx="0" cy="0" r="3" fill="#ffffff"/>
      <circle cx="0" cy="0" r="8" fill="#f72585" opacity="0.4"/>
    </g>

    <g transform="translate(1620, 180)">
      <line x1="-12" y1="0" x2="12" y2="0" stroke="#ffffff" stroke-width="1"/>
      <line x1="0" y1="-12" x2="0" y2="12" stroke="#ffffff" stroke-width="1"/>
      <circle cx="0" cy="0" r="2.5" fill="#ffffff"/>
    </g>

    <g transform="translate(320, 520)">
      <line x1="-14" y1="0" x2="14" y2="0" stroke="#ffffff" stroke-width="1"/>
      <line x1="0" y1="-14" x2="0" y2="14" stroke="#ffffff" stroke-width="1"/>
      <circle cx="0" cy="0" r="2.8" fill="#ffffff"/>
    </g>

    <!-- Point Stars -->
    <circle cx="120" cy="180" r="1.5" opacity="0.8"/>
    <circle cx="210" cy="80" r="1" opacity="0.6"/>
    <circle cx="380" cy="120" r="2" opacity="0.9"/>
    <circle cx="490" cy="340" r="1.2" opacity="0.75"/>
    <circle cx="750" cy="150" r="1.8" opacity="0.85"/>
    <circle cx="890" cy="280" r="1.5" opacity="0.7"/>
    <circle cx="980" cy="110" r="2.2" opacity="0.9"/>
    <circle cx="1240" cy="190" r="1" opacity="0.55"/>
    <circle cx="1450" cy="120" r="1.7" opacity="0.8"/>
    <circle cx="1560" cy="270" r="1.2" opacity="0.65"/>
    <circle cx="1780" cy="90" r="2" opacity="0.85"/>
    <circle cx="1850" cy="240" r="1.5" opacity="0.75"/>
    
    <circle cx="180" cy="850" r="1.6" opacity="0.8"/>
    <circle cx="340" cy="940" r="1.2" opacity="0.6"/>
    <circle cx="520" cy="820" r="2" opacity="0.9"/>
    <circle cx="780" cy="960" r="1" opacity="0.7"/>
    <circle cx="950" cy="880" r="1.5" opacity="0.85"/>
    <circle cx="1180" cy="920" r="1.8" opacity="0.75"/>
    <circle cx="1380" cy="840" r="1.2" opacity="0.6"/>
    <circle cx="1520" cy="970" r="2" opacity="0.9"/>
    <circle cx="1720" cy="890" r="1.4" opacity="0.8"/>
    <circle cx="1840" cy="780" r="1.6" opacity="0.7"/>
  </g>
</svg>
